apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ownfoil-config
  annotations:
    nfs.io/storage-path: "containers/kubernetes/ownfoil/config"
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: "nfs-dynamic"
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ownfoil-data
  annotations:
    nfs.io/storage-path: "containers/kubernetes/ownfoil/data"
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: "nfs-dynamic"
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ownfoil-games
  annotations:
    nfs.io/storage-path: "games/Game Backups/switch/games"
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: "nfs-dynamic"
  resources:
    requests:
      storage: 4Ti
