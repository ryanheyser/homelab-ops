---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ownfoil-admin-secret
spec:
  refreshInterval: "1m"
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: ownfoil-admin-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        USER_ADMIN_NAME: "{{ .adminName }}"
        USER_ADMIN_PASSWORD: "{{ .adminPassword }}"
  data:
    - adminName: "adminName"
      remoteRef:
        # metadataPolicy: Fetch
        key: "ownfoil-admin-secret"
        property: "admin-name"
    - adminPassword: "secretKey"
      remoteRef:
        # metadataPolicy: Fetch
        key: "ownfoil-admin-secret"
        property: "admin-password"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ownfoil-user-secret
spec:
  refreshInterval: "1m"
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: ownfoil-user-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        USER_GUEST_NAME: "{{ .guestName }}"
        USER_GUEST_PASSWORD: "{{ .guestPassword }}"
  data:
    - guestName: "guestName"
      remoteRef:
        # metadataPolicy: Fetch
        key: "ownfoil-user-secret"
        property: "guest-name"
    - guestPassword: "secretKey"
      remoteRef:
        # metadataPolicy: Fetch
        key: "ownfoil-user-secret"
        property: "guest-password"
---

