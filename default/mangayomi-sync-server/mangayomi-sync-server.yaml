apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mangayomi-sync-server
  namespace: default
spec:
  driftDetection:
    mode: enabled
  interval: 15m
  chart:
    spec:
      # renovate: registryUrl=https://bjw-s-labs.github.io/helm-charts
      chart: app-template
      version: 4.6.2
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      main:
        enabled: true
        defaultContainerOptions:
          resources:
            requests:
              cpu: 10m
              memory: 250Mi
            limits:
              memory: 2Gi
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            fsGroup: 568
            fsGroupChangePolicy: "OnRootMismatch"
            supplementalGroups: [ 911, 1000, 1001, 3001 ]
          tolerations:
          - key: "arm"
            operator: "Exists"
        initContainers:
          migrate:
            image:
              # renovate: repository=notakari/mangayomi-sync-server
              repository: notakari/mangayomi-sync-server
              tag: 0.1.2
            securityContext:
              runAsUser: 568
              runAsGroup: 568
            env:
              TZ: America/New_York
            envFrom:
            - secretRef:
                name: mangayomi-sync-server-postgres-config
                optional: false             
            command:
            - "npx" 
            - "prisma"
            - "migrate"
            - "deploy"
        containers:
          main:
            image:
              # renovate: repository=notakari/mangayomi-sync-server
              repository: notakari/mangayomi-sync-server
              tag: 0.1.2
            securityContext:
              runAsUser: 568
              runAsGroup: 568
            env:
              TZ: America/New_York
              HOST: 0.0.0.0
              PORT: 3000
              AVATAR_STORAGE_DIR: /data/avatars
              TRUST_PROXY_HEADERS: "true"
              NODE_OPTIONS: "--max-http-header-size=32768"
            envFrom:
            - secretRef:
                name: mangayomi-sync-server-secret-key
                optional: false
            - secretRef:
                name: mangayomi-sync-server-postgres-config
                optional: false
    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          http:
            port: 3000
            targetPort: 3000

    ingress:
      main:
        className: 'traefik'
        annotations:
          kubernetes.io/ingress.class: traefik
          traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
          traefik.ingress.kubernetes.io/router.middlewares: network-system-large-max-request-body@kubernetescrd,network-system-compress@kubernetescrd,network-system-octet-stream-force@kubernetescrd
          # traefik.ingress.kubernetes.io/router.middlewares: "network-system-authentik@kubernetescrd"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          # gethomepage.dev/icon: mangayomi-server.svg
          gethomepage.dev/name: Mangayomi Server
          gethomepage.dev/description: Mangayomi Server is a self-hosted manga and webtoon index application that allows you to sync your manga and webtoon collections reading completion with your local devices.
        hosts:
        - host: &host "mangayomi-sync-server.homelab.heyser.xyz"
          paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http
        tls:
        - hosts:
          - *host
          secretName: mangayomi-sync-server-homelab-heyser-xyz-tls
    persistence:
      app-data:
        existingClaim: mangayomi-sync-server-app-data
        advancedMounts:
          main:
            main:
            - path: "/data"
              readOnly: false
      config-override:
        enabled: true
        type: configMap
        name: mangayomi-config-override
        advancedMounts:
          # Targets your main app container structure cleanly
          main: # Replace this if your app container identifier key is named differently
            main:
              - path: /app/next.config.ts
                subPath: next.config.ts
