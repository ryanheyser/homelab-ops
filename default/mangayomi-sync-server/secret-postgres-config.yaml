apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mangayomi-sync-server-postgres-config
spec:
  refreshInterval: "1m"
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: mangayomi-sync-server-postgres-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "{{ .postgresConfigDBUrl }}"
  data:
    - secretKey: "postgresConfigDBUrl"
      remoteRef:
        # metadataPolicy: Fetch
        key: "mangayomi-sync-server-postgres-config"
        property: "postgres-config-database-url"
