# # Intel GPU metrics exporter (one pod per GPU node).
# #
# # Image: home-operations/drm-exporter, the maintained successor of the archived
# # onedr0p/intel-gpu-exporter. Metrics are now drm_* (were igpu_*) on port 8081.
# #
# # GPU access: gpu.intel.com/monitoring from the GPU plugin (enableMonitoring in
# # gpu-plugin.yaml). It gives read access to every Intel GPU on the node (i915
# # and xe) without consuming one. Requesting gpu.intel.com/i915 instead would take
# # the only share (sharedDevNum: 1) away from real workloads.
# #
# # Privileges: not privileged. Root with all capabilities dropped except PERFMON
# # (engine utilization and RAPL power via the perf PMU), plus /sys read-only.
# # SYS_RAWIO and /dev/cpu (MSR) are left out on purpose; the only loss is the
# # Intel iGPU package temperature.
