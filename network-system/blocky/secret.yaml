---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valkey-auth
  namespace: network-system
spec:
  refreshInterval: "1m"
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: valkey-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        valkey-username: "default"
        valkey-password: "{{ .valkeyPassword }}"
  data:
    - secretKey: valkeyPassword
      remoteRef:
        key: valkey-secret
        property: valkeyPassword
