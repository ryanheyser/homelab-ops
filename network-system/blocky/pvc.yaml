---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: blocky-valkey-data
  namespace: network-system
  annotations:
    nfs.io/storage-path: "containers/kubernetes/blocky/valkey/data"
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: "nfs-dynamic"
  resources:
    requests:
      storage: 10Gi
