        - /gdmf.apple.com/
        - /axm-app.apple.com/
        - /comm-cohort.ess.apple.com/
        - /comm-main.ess.apple.com/
      allowlists:
        lan:
        - "*.heyser.xyz"
        - "*.heyser.lan"
        - "*.plex.direct"
