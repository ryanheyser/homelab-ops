apiVersion: apps/v1
kind: Deployment
metadata:
  name: blocky
  namespace: network-system
  labels:
    app.kubernetes.io/name: blocky
    app.kubernetes.io/instance: blocky
spec:
  replicas: 3
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: blocky
      app.kubernetes.io/instance: blocky
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blocky
        app.kubernetes.io/instance: blocky
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      automountServiceAccountToken: false
      dnsPolicy: ClusterFirst
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: blocky
        # renovate: repository=ghcr.io/0xerr0r/blocky
        image: ghcr.io/0xerr0r/blocky:v0.35.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: dns-tcp
          containerPort: 53
          protocol: TCP
        - name: dns-udp
          containerPort: 53
          protocol: UDP
        - name: http
          containerPort: 80
          protocol: TCP
        - name: https-tcp
          containerPort: 443
          protocol: TCP
        - name: https-udp
          containerPort: 443
          protocol: UDP
        - name: dot-tcp
          containerPort: 853
          protocol: TCP
        securityContext:
          runAsNonRoot: true
          runAsUser: 100
          runAsGroup: 100
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
        volumeMounts:
        - name: config
          mountPath: /app/config.yml
          subPath: config.yml
          readOnly: true
        - name: certificate
          mountPath: /opt/blockycertificate
          readOnly: true
        - name: valkey-auth
          mountPath: /run/secrets/valkey
          readOnly: true
        - name: cache
          mountPath: /app/cache
        - name: logs
          mountPath: /logs
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
        startupProbe:
          exec:
            command:
            - /app/blocky
            - healthcheck
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 30
        livenessProbe:
          exec:
            command:
            - /app/blocky
            - healthcheck
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /app/blocky
            - healthcheck
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: config
        configMap:
          name: blocky-config
          items:
          - key: config.yaml
            path: config.yml
      - name: certificate
        secret:
          secretName: blocky-homelab-heyser-xyz-tls
          optional: false
      - name: valkey-auth
        secret:
          secretName: valkey-auth
          optional: false
          defaultMode: 0440
          items:
          - key: valkey-username
            path: valkey-username
          - key: valkey-password
            path: valkey-password
      - name: cache
        emptyDir: {}
      - name: logs
        emptyDir: {}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: blocky
                app.kubernetes.io/instance: blocky
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: blocky
            app.kubernetes.io/instance: blocky
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: blocky
  namespace: network-system
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: blocky
      app.kubernetes.io/instance: blocky
