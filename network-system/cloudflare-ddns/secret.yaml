---
# Cloudflare API token for favonia/cloudflare-ddns (see cronjob.yaml).
#
# Vault: key "cloudflare-api-token", property "ddns-token".
# The token needs Zone > DNS > Edit and Zone > Zone > Read on heyser.xyz
# ("Edit zone DNS" template). The old global API key, zone ID and per-record
# IDs are no longer used: the updater finds the zone and records by name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-ddns
  namespace: network-system
spec:
  refreshInterval: "30m"
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: cloudflare-ddns
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        CLOUDFLARE_API_TOKEN: "{{ .cloudflareApiToken }}"
  data:
    - secretKey: "cloudflareApiToken"
      remoteRef:
        # metadataPolicy: Fetch
        key: "cloudflare-api-token"
        property: "ddns-token"
