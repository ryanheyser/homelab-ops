apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: large-max-request-body
  namespace: network-system
spec:
  buffering:
    # 100 MB limit in bytes
    maxRequestBodyBytes: 104857600
    memRequestBodyBytes: 104857600
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: compress
  namespace: network-system
spec:
  compress: {}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: octet-stream-force
  namespace: network-system
spec:
  headers:
    customRequestHeaders:
      Content-Type: "application/octet-stream"
      Content-Length: ""
    customResponseHeaders:
      X-Bypass-Status: "Active"
---
