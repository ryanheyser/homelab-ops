apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: large-max-request-body
  namespace: network-system
spec:
  buffering:
    # 100 MB limit in bytes
    maxRequestBodyBytes: 104857600 # 100MB equivalent
    memRequestBodyBytes: 2097152   # Buffer 2MB in memory safely
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: compress-request-body
  namespace: network-system
spec:
  compress: {}
---
