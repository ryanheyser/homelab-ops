---
# Cloudflare credentials for external-dns (see external-dns.yaml).
#
# Reuses the zone-scoped DNS token that favonia/cloudflare-ddns uses
# (Vault "cloudflare-api-token"/"ddns-token": Zone > DNS > Edit and
# Zone > Zone > Read on heyser.xyz). Both workloads need the same permissions.
# For separate revocation, create a second token and point "token" at it.
#
# The zone ID is not secret; it comes from Vault so it is not hard-coded twice.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-dns
  namespace: network-system
spec:
  refreshInterval: "30m"
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: external-dns
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        CF_API_TOKEN: "{{ .cloudflareApiToken }}"
        CF_ZONE_ID: "{{ .cloudflareZoneId }}"
  data:
    - secretKey: "cloudflareApiToken"
      remoteRef:
        key: "cloudflare-api-token"
        property: "ddns-token"
    - secretKey: "cloudflareZoneId"
      remoteRef:
        key: "cloudflare-zone-id"
        property: "zone-id"
