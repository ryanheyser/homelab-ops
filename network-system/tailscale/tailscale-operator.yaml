apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: network-system
spec:
  driftDetection:
    mode: enabled
  interval: 15m
  chart:
    spec:
      # renovate: registryUrl=https://pkgs.tailscale.com/helmcharts
      chart: tailscale-operator
      version: 1.104.2
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: flux-system
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
    crds: CreateReplace
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
    crds: CreateReplace
  uninstall:
    keepHistory: false
  values:
    installCRDs: false
    oauthSecretVolume:
      secret:
        secretName: tailscale-credentials
    operatorConfig:
      extraEnv:
      - name: TS_DEST_IP_BYPASS
        value: "10.254.0.1"
      - name: TS_OUTBOUND_INTERFACE_MTU
        value: "1280"
