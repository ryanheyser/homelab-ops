apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: ts-proxyclass
spec:
  tailscale:
    acceptRoutes: true
  metrics:
    enable: true
  statefulSet:
    pod:
      spec:
        containers:
          - name: tailscale
            # The startup probe gives the pod a 60-second runway to boot up
            startupProbe:
              httpGet:
                path: /healthz
                port: 9002
              failureThreshold: 30
              periodSeconds: 2
            # Liveness only kicks in AFTER the startup probe succeeds
            livenessProbe:
              initialDelaySeconds: 0
              periodSeconds: 10
              failureThreshold: 3
      tailscaleContainer:
        env:
        - name: TS_DEST_IP_BYPASS
          value: "10.254.0.1"
        - name: TS_OUTBOUND_INTERFACE_MTU
          value: "1280"
        - name: TS_KUBE_SECRET_REST_WINDOW
          value: "30s"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: tailscale.com/parent-resource
                  operator: In
                  values:
                  - ts-k8s-home-cidrs
              topologyKey: "kubernetes.io/hostname"
          - weight: 99
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: tailscale.com/parent-resource
                  operator: In
                  values:
                  - ts-proxygroup
              topologyKey: "kubernetes.io/hostname"
          - weight: 98
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: tailscale.com/parent-resource
                  operator: In
                  values:
                  - ts-k8s-pod-cidrs
              topologyKey: "kubernetes.io/hostname"
          - weight: 97
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: tailscale.com/parent-resource
                  operator: In
                  values:
                  - ts-k8s-exit-node
              topologyKey: "kubernetes.io/hostname"
          - weight: 80
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: tailscale.com/parent-resource
                  operator: In
                  values:
                  - ts-k8s-homelab
              topologyKey: "kubernetes.io/hostname"
          - weight: 1
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: tailscale.com/parent-resource
                  operator: In
                  values:
                  - ts-k8s-disneyplus
              topologyKey: "kubernetes.io/hostname"
          - weight: 2
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: tailscale.com/parent-resource
                  operator: In
                  values:
                  - ts-k8s-hulu
              topologyKey: "kubernetes.io/hostname"
          - weight: 3
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: tailscale.com/parent-resource
                  operator: In
                  values:
                  - ts-k8s-netflix
              topologyKey: "kubernetes.io/hostname"
          - weight: 4
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: tailscale.com/parent-resource
                  operator: In
                  values:
                  - ts-k8s-app-home-cidrs
              topologyKey: "kubernetes.io/hostname"
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyGroup
metadata:
  name: ts-egress-proxygroup
spec:
  type: egress
  replicas: 2
  hostnamePrefix: ts-egress-proxygroup
  proxyClass: ts-proxyclass
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyGroup
metadata:
  name: ts-ingress-proxygroup
spec:
  type: ingress
  replicas: 2
  hostnamePrefix: ts-ingress-proxygroup
  proxyClass: ts-proxyclass
